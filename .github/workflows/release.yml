name: Build release artifacts

on:
  push:
  pull_request:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  macos:
    name: CI MacOS arm64-x64
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Set package name
        id: package
        run: |
          version=$(git describe --tags --always)
          echo "filename=crusn-${version}-macos-arm64-x64.dmg" >> "$GITHUB_OUTPUT"
      - name: Install dependencies
        run: brew install ninja
      - name: Set up SDL
        uses: libsdl-org/setup-sdl@main
        with:
          add-to-environment: true
          build-type: Release
          cmake-arguments: '-DCMAKE_OSX_ARCHITECTURES="x86_64;arm64" -DCMAKE_OSX_DEPLOYMENT_TARGET=11.0'
          cmake-generator: Ninja
          discriminator: arm64-x64
          version: 2-latest
      - name: Build
        run: |
          cmake -S . -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=RelWithDebInfo \
            -DCMAKE_OSX_ARCHITECTURES="x86_64;arm64" \
            -DCRUSN_MACOS_BUNDLE=ON
          cmake --build build --parallel
      - name: Package application and symbols
        env:
          PACKAGE_FILE: ${{ steps.package.outputs.filename }}
        run: |
          app="build/Cruis'n USA.app"
          executable="$app/Contents/MacOS/Cruis'n USA"
          frameworks="$app/Contents/Frameworks"
          mkdir -p "$frameworks" dist/dmg

          sdl_lib=$(otool -L "$executable" | awk '/SDL2\.framework.*SDL2|libSDL2.*dylib/ { print $1; exit }')
          test -n "$sdl_lib"
          case "$sdl_lib" in
            *.framework/*)
              framework_root="${sdl_lib%%.framework/*}.framework"
              framework_relative="${sdl_lib#*.framework/}"
              cp -R "$framework_root" "$frameworks/"
              install_name_tool -change "$sdl_lib" "@executable_path/../Frameworks/SDL2.framework/$framework_relative" "$executable"
              codesign --force --sign - "$frameworks/SDL2.framework"
              ;;
            *)
              sdl_name=$(basename "$sdl_lib")
              sdl_source="$sdl_lib"
              case "$sdl_source" in
                @rpath/*) sdl_source="$(pkg-config --variable=libdir sdl2)/$sdl_name" ;;
              esac
              cp "$sdl_source" "$frameworks/$sdl_name"
              install_name_tool -change "$sdl_lib" "@executable_path/../Frameworks/$sdl_name" "$executable"
              codesign --force --sign - "$frameworks/$sdl_name"
              ;;
          esac

          codesign --force --sign - "$app"
          cp -R "$app" dist/dmg/
          dsymutil "$executable" -o "dist/dmg/Cruis'n USA.dSYM"
          cat > dist/dmg/README.txt <<'EOF'
          Copy Cruis'n USA.app to a writable folder, then create a roms folder
          beside the app containing a legally obtained crusnusa.zip ROM set.

          Expected layout:
            Cruis'n USA.app
            roms/crusnusa.zip

          This development build is not notarized. On first launch, Control-click
          the app, choose Open, then confirm Open in the macOS dialog.
          EOF
          hdiutil create -volname "Cruis'n USA" -srcfolder dist/dmg -ov -format UDZO "dist/$PACKAGE_FILE"
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.package.outputs.filename }}
          path: dist/${{ steps.package.outputs.filename }}
          if-no-files-found: error

  linux:
    name: CI Linux x64
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Set package name
        id: package
        run: |
          version=$(git describe --tags --always)
          echo "filename=crusn-${version}-linux-x64.tar.gz" >> "$GITHUB_OUTPUT"
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libsdl2-dev libcurl4-openssl-dev ninja-build patchelf
      - name: Build
        run: |
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=RelWithDebInfo
          cmake --build build --parallel
          cmake --build build --target startup-probe check-game-portable-boundary
          python3 tools/test_startup.py build/startup-probe
      - name: Package binary and symbols
        env:
          PACKAGE_FILE: ${{ steps.package.outputs.filename }}
        run: |
          mkdir -p dist/package
          cp build/crusn dist/package/
          sdl_lib=$(ldd build/crusn | awk '/libSDL2-2.0.so.0/ { print $3; exit }')
          test -n "$sdl_lib"
          cp "$sdl_lib" dist/package/libSDL2-2.0.so.0
          patchelf --set-rpath '$ORIGIN' dist/package/crusn
          objcopy --only-keep-debug dist/package/crusn dist/package/crusn.debug
          strip --strip-debug dist/package/crusn
          (cd dist/package && objcopy --add-gnu-debuglink=crusn.debug crusn)
          cmake -E chdir dist/package cmake -E tar czf "../$PACKAGE_FILE" .
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.package.outputs.filename }}
          path: dist/${{ steps.package.outputs.filename }}
          if-no-files-found: error

  windows:
    name: CI Windows x64
    runs-on: windows-latest
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: true
          install: >-
            git
            mingw-w64-ucrt-x86_64-gcc
            mingw-w64-ucrt-x86_64-cmake
            mingw-w64-ucrt-x86_64-ninja
            mingw-w64-ucrt-x86_64-curl
            mingw-w64-ucrt-x86_64-SDL2
            mingw-w64-ucrt-x86_64-python
      - name: Set package name
        id: package
        run: |
          version=$(git describe --tags --always)
          echo "filename=crusn-${version}-windows-x64.zip" >> "$GITHUB_OUTPUT"
      - name: Build
        run: |
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=RelWithDebInfo
          cmake --build build --parallel
          cmake --build build --target startup-probe check-game-portable-boundary
          python tools/test_startup.py build/startup-probe.exe
      - name: Package binary and runtime DLLs
        env:
          PACKAGE_FILE: ${{ steps.package.outputs.filename }}
        run: |
          mkdir -p dist/package
          cp build/crusn.exe dist/package/
          # Resolve the full curl/TLS/SDL runtime dependency tree.
          export CRUSN_RUNTIME_BIN="$(cygpath -w /ucrt64/bin)"
          python - <<'PYTHON'
          import os
          import pathlib
          import re
          import shutil
          import subprocess
          package = pathlib.Path('dist/package')
          pending = [package / 'crusn.exe']
          copied = set()
          runtime_bin = pathlib.Path(os.environ['CRUSN_RUNTIME_BIN'])
          while pending:
              binary = pending.pop()
              imports = subprocess.check_output(['objdump', '-p', str(binary)], text=True)
              for name in re.findall(r'DLL Name: (\S+)', imports):
                  source = runtime_bin / name
                  if source.is_file() and name.lower() not in copied:
                      copied.add(name.lower())
                      target = package / name
                      shutil.copy2(source, target)
                      pending.append(target)
          PYTHON
          # The OpenSSL curl backend uses this bundle for HTTPS verification.
          cp /ucrt64/etc/ssl/certs/ca-bundle.crt dist/package/curl-ca-bundle.crt
          cmake -E chdir dist/package cmake -E tar cf "../$PACKAGE_FILE" --format=zip .
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.package.outputs.filename }}
          path: dist/${{ steps.package.outputs.filename }}
          if-no-files-found: error

  web:
    name: CI WebAssembly
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: mymindstorm/setup-emsdk@v14
        with:
          version: '4.0.19'
          actions-cache-folder: emsdk-cache
      - name: Build web port
        run: |
          emcmake cmake -S . -B build-web -DCMAKE_BUILD_TYPE=Release -DCRUSN_TRACE=OFF
          cmake --build build-web --parallel
          cmake --build build-web --target check-game-portable-boundary
      - name: Package web build
        run: |
          version=$(git describe --tags --always)
          cmake -E chdir build-web cmake -E tar cf "../crusn-${version}-web.zip" --format=zip crusn.html crusn.js crusn.wasm
      - uses: actions/upload-artifact@v4
        with:
          name: crusn-web
          path: crusn-*-web.zip
          if-no-files-found: error

      - name: Configure GitHub Pages
        if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
        uses: actions/configure-pages@v5
      - name: Stage GitHub Pages site
        if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
        run: |
          mkdir -p build-web/pages
          cp build-web/crusn.html build-web/pages/index.html
          cp build-web/crusn.js build-web/crusn.wasm build-web/pages/
      - name: Upload GitHub Pages site
        if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
        uses: actions/upload-pages-artifact@v4
        with:
          path: build-web/pages

  deploy-pages:
    name: Deploy web game to GitHub Pages
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    needs: web
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    concurrency:
      group: github-pages
      cancel-in-progress: false
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

  publish:
    if: github.event_name == 'release'
    needs: [macos, linux, windows, web]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: crusn-*
          merge-multiple: true
          path: dist
      - name: Attach artifacts to release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: gh release upload "$RELEASE_TAG" dist/* --clobber
